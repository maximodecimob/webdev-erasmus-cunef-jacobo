<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Vibe Tickets</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="nav"></header>
  <main id="main" class="container container-narrow page">
    <div class="card auth-card">
      <h1>Log in</h1>
      <form class="form" id="login-form" action="/login" method="POST">
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" id="email" type="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" type="password" name="password" required autocomplete="current-password">
            <button class="toggle-pw" id="toggle-pw" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password"><svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg></button>
          </div>
        </div>
        <div id="status-message" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log in</button>
      </form>
      <div class="divider">or</div>
      <a class="btn btn-ghost btn-block" href="/auth/google">Continue with Google</a>
      <p class="auth-foot">New here? <a href="/register">Create an account</a></p>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
  <script>
    getMe().then(renderNav);
    const loginError = new URLSearchParams(location.search).get('error');
    if (loginError) {
      const box = document.getElementById('status-message');
      box.className = 'state state-inline state-error';
      box.textContent = loginError === 'google_not_configured' ? 'Google sign-in is not set up yet' : 'Google sign-in failed, please try again';
    }
    const pw = document.getElementById('password');
    const togglePw = document.getElementById('toggle-pw');
    togglePw.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      togglePw.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      togglePw.querySelector('.icon-eye').toggleAttribute('hidden', show);
      togglePw.querySelector('.icon-eye-off').toggleAttribute('hidden', !show);
      togglePw.setAttribute('aria-pressed', String(show));
    });
    const form = document.getElementById('login-form');
    const statusDiv = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.className = 'state state-inline state-loading';
      statusDiv.innerHTML = '<span class="row"><span class="spinner"></span> Signing in...</span>';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' },
          redirect: 'follow'
        });
        if (res.ok) {
          statusDiv.className = 'state state-inline state-success';
          statusDiv.textContent = 'Signed in. Redirecting...';
          window.location.href = '/events';
          return;
        }
        const data = await res.json().catch(() => ({}));
        statusDiv.className = 'state state-inline state-error';
        statusDiv.setAttribute('role', 'alert');
        statusDiv.textContent = res.status === 401 ? 'Invalid email or password' : (data.error || 'Could not sign in, please try again');
      } catch (err) {
        statusDiv.className = 'state state-inline state-error';
        statusDiv.setAttribute('role', 'alert');
        statusDiv.textContent = 'Could not reach the server';
      }
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
