<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - Vibe Tickets</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="nav"></header>
  <main id="main" class="container container-narrow page">
    <div class="card auth-card">
      <h1>Create account</h1>
      <form class="form" id="register-form">
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" id="email" type="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="pw-hint">
          <p class="hint" id="pw-hint">At least 8 characters.</p>
        </div>
        <fieldset class="fieldset">
          <legend class="legend">I want to...</legend>
          <div class="choice-group">
            <label class="choice"><input type="radio" name="role" value="customer" checked> I want to buy tickets</label>
            <label class="choice"><input type="radio" name="role" value="organizer"> I organize events</label>
          </div>
        </fieldset>
        <div id="status-message" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>
  <script src="/static/js/app.js"></script>
  <script>
    getMe().then(renderNav);
    const form = document.getElementById('register-form');
    const statusDiv = document.getElementById('status-message');
    const submitBtn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.className = 'state state-inline state-loading';
      statusDiv.removeAttribute('role');
      statusDiv.innerHTML = '<span class="row"><span class="spinner"></span> Creating your account...</span>';
      const role = form.elements.role.value;
      try {
        await api('/api/auth/register', {
          method: 'POST',
          json: { email: form.elements.email.value, password: form.elements.password.value, role },
        });
        statusDiv.className = 'state state-inline state-success';
        statusDiv.textContent = 'Account created. Redirecting...';
        window.location.href = role === 'organizer' ? '/organizer' : '/events';
        return;
      } catch (err) {
        statusDiv.className = 'state state-inline state-error';
        statusDiv.setAttribute('role', 'alert');
        statusDiv.textContent = err.message;
      }
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
